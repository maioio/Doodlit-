<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0b0f19" />
  <title>Doodlit!</title>
  <link rel="icon" href="favicon.ico" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="logoWrap">
          <!-- אם תוסיף קובץ public/logo.png זה יוצג אוטומטית -->
          <img id="brandLogo" src="logo.png" alt="Doodlit" onerror="this.style.display='none'">
        </div>
        <div class="brandText">
          <div class="brandName">Doodlit!</div>
          <div class="brandSub">משחק ציור וניחושים</div>
        </div>
      </div>

      <div class="topActions">
        <button id="btnShare" class="btn ghost" type="button">שיתוף לינק</button>
        <button id="btnRestart" class="btn danger" type="button" title="איפוס משחק (מארח בלבד)">איפוס</button>
      </div>
    </header>

    <main class="layout">
      <!-- LEFT: canvas + round info -->
      <section class="board">
        <div class="hud">
          <div class="hudRow">
            <div class="pill">
              <span class="label">סבב</span>
              <span id="hudRound" class="value">0</span>
            </div>

            <div class="pill">
              <span class="label">זמן</span>
              <span id="hudTime" class="value">0</span>
            </div>

            <div class="pill wordPill">
              <span class="label">מילה</span>
              <span id="hudWord" class="value">-</span>
            </div>
          </div>

          <div class="hudRow">
            <div class="drawerInfo" id="hudDrawer">ממתין...</div>

            <div class="hudButtons">
              <button id="btnClear" class="btn" type="button" disabled>נקה</button>
              <button id="btnBuyTime" class="btn" type="button" disabled>הוסף זמן</button>
            </div>
          </div>
        </div>

        <div class="canvasWrap">
          <canvas id="canvas"></canvas>
        </div>

        <!-- Choose word modal -->
        <div id="chooseModal" class="modal hidden" role="dialog" aria-modal="true">
          <div class="modalCard">
            <div class="modalTitle">בחר/י מילה</div>
            <div class="modalSub">יש לך זמן קצר לבחור. אם לא, נבחר אוטומטית.</div>
            <div id="chooseButtons" class="chooseButtons"></div>
          </div>
        </div>

        <!-- Join modal -->
        <div id="joinModal" class="modal" role="dialog" aria-modal="true">
          <div class="modalCard">
            <div class="modalTitle">כניסה לחדר</div>
            <div class="modalSub">שתפו לינק למשפחה, וכל מי שיפתח אותו ייכנס לאותו החדר.</div>

            <div class="field">
              <label class="fieldLabel" for="inpName">שם</label>
              <input id="inpName" class="fieldInput" inputmode="text" autocomplete="nickname" maxlength="18" placeholder="לדוגמה: מאיו" />
            </div>

            <div class="field">
              <label class="fieldLabel" for="inpRoom">קוד חדר</label>
              <input id="inpRoom" class="fieldInput mono" inputmode="text" maxlength="32" placeholder="לדוגמה: family1" />
              <div class="hint">אם פתחתם לינק שקיבלתם, זה כבר ימולא.</div>
            </div>

            <button id="btnJoin" class="btn primary" type="button">כניסה</button>
            <div id="joinErr" class="err hidden"></div>
          </div>
        </div>
      </section>

      <!-- RIGHT: players + chat -->
      <aside class="side">
        <div class="card">
          <div class="cardTitle">שחקנים</div>
          <div id="playersList" class="players"></div>
        </div>

        <div class="card chatCard">
          <div class="cardTitle">צ׳אט וניחושים</div>
          <div id="chatLog" class="chatLog"></div>

          <form id="chatForm" class="chatForm" autocomplete="off">
            <input id="chatInput" class="chatInput" maxlength="140" placeholder="כתוב/י ניחוש או הודעה" />
            <button class="btn primary" type="submit">שלח</button>
          </form>

          <div id="toast" class="toast hidden"></div>
        </div>
      </aside>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="index.js"></script>
</body>
</html>
